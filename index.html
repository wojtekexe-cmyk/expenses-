<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E2420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Expense Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2420;
    --paper:#EFE6CE;
    --paper-dark:#E2D6B4;
    --paper-light:#FFF9EA;
    --line:#C9BC94;
    --amber:#F0B429;
    --steel:#2C4451;
    --rust:#A33B2C;
    --text:#22271F;
    --text-soft:#565C4B;
    --radius-sm:4px;
    --radius-md:8px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  button, input{ font-family:inherit; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--steel); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  header.bar{
    background:var(--ink);
    color:var(--paper);
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--amber);
  }
  header.bar h1{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.04em;
    margin:0;
    color:var(--amber);
  }
  header.bar .sub{
    font-size:11px;
    color:var(--paper);
    opacity:0.65;
    margin-top:3px;
    letter-spacing:0.02em;
  }
  .gear{
    background:none;
    border:1px solid var(--paper);
    color:var(--paper);
    width:36px; height:36px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  main{ padding:16px; flex:1; }

  .add-card{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:16px;
    margin-bottom:22px;
  }
  .add-card h2{
    font-family:'Oswald',sans-serif;
    font-size:14px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--text-soft);
    margin:0 0 12px;
  }
  .row{ display:flex; gap:10px; margin-bottom:10px; }
  .field{ flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .field label{ font-size:11px; color:var(--text-soft); }
  input[type=date], input[type=text], input[type=tel]{
    border:1px solid var(--line);
    background:#fff;
    border-radius:var(--radius-sm);
    padding:10px;
    font-size:15px;
    color:var(--text);
    width:100%;
  }
  .amount-wrap{ display:flex; align-items:center; border:1px solid var(--line); background:#fff; border-radius:var(--radius-sm); }
  .amount-wrap span{ padding-left:10px; color:var(--text-soft); font-size:15px; }
  .amount-wrap input{ border:none; background:none; padding:10px; font-size:15px; width:100%; }
  .photo-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .photo-btn{
    border:1px dashed var(--steel);
    background:none;
    color:var(--steel);
    padding:10px 14px;
    border-radius:var(--radius-sm);
    font-size:13px;
    cursor:pointer;
  }
  .thumb{ width:44px; height:44px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--line); }
  .clear-photo{ background:none; border:none; color:var(--rust); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  .btn-primary{
    width:100%;
    background:var(--amber);
    border:none;
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.03em;
    font-size:15px;
    padding:13px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; }

  .week{ margin-bottom:24px; }
  .perf{ border-top:2px dashed var(--line); margin-bottom:12px; }
  .week-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px; }
  .week-head h3{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    margin:0;
    color:var(--text);
  }
  .week-count{ font-size:12px; color:var(--text-soft); margin-top:2px; }
  .tag{
    background:var(--amber);
    color:var(--ink);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:6px 10px;
    border-radius:var(--radius-sm);
    white-space:nowrap;
    flex-shrink:0;
  }
  .entries{ border-top:1px solid var(--line); }
  .entry{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .entry img{ width:40px; height:40px; object-fit:cover; border-radius:var(--radius-sm); border:1px solid var(--line); flex-shrink:0; }
  .entry .noimg{ width:40px; height:40px; border-radius:var(--radius-sm); border:1px dashed var(--line); flex-shrink:0; }
  .entry .meta{ flex:1; min-width:0; }
  .entry .date{ font-size:11px; color:var(--text-soft); }
  .entry .note{ font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry .amt{ font-weight:600; font-size:14px; flex-shrink:0; }
  .entry .del{ background:none; border:none; color:var(--rust); font-size:18px; cursor:pointer; padding:4px; line-height:1; flex-shrink:0; }
  .week-actions{ display:flex; gap:10px; margin-top:12px; }
  .btn-secondary{
    flex:1;
    background:none;
    border:1px solid var(--steel);
    color:var(--steel);
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.02em;
    padding:10px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .btn-secondary.send{ border-color:var(--ink); color:var(--ink); background:var(--paper-dark); }
  .btn-secondary:disabled{ opacity:0.5; cursor:wait; }

  .empty{ text-align:center; padding:40px 20px; color:var(--text-soft); }
  .empty p{ margin:6px 0; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-backdrop.hidden{ display:none; }
  .modal{ background:var(--paper); width:100%; max-width:480px; border-radius:12px 12px 0 0; padding:20px; }
  .modal h2{ font-family:'Oswald',sans-serif; font-size:16px; margin:0 0 14px; letter-spacing:0.03em; text-transform:uppercase; }
  .modal .field{ margin-bottom:12px; }
  .modal .hint{ font-size:11px; color:var(--text-soft); margin-top:3px; }

  footer{ text-align:center; font-size:11px; color:var(--text-soft); opacity:0.7; padding:16px; }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div>
      <h1>Expense Docket</h1>
      <div class="sub">Weekly claims — week ending Sunday</div>
    </div>
    <button class="gear" id="settingsBtn" aria-label="Settings">&#9881;</button>
  </header>

  <main>
    <section class="add-card">
      <h2>Add expense</h2>
      <div class="row">
        <div class="field">
          <label for="expDate">Date</label>
          <input type="date" id="expDate">
        </div>
        <div class="field">
          <label for="expAmount">Amount</label>
          <div class="amount-wrap">
            <span id="currencySymbol">£</span>
            <input type="text" inputmode="decimal" id="expAmount" placeholder="0.00">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="expNote">What for (optional)</label>
          <input type="text" id="expNote" placeholder="e.g. Fuel, parking, materials">
        </div>
      </div>
      <div class="photo-row">
        <button type="button" class="photo-btn" id="photoBtn">📷 Add photo evidence</button>
        <img id="photoPreview" class="thumb" style="display:none;" alt="">
        <button type="button" class="clear-photo" id="clearPhoto" style="display:none;">Remove</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
      <button class="btn-primary" id="addBtn" disabled>Add expense</button>
    </section>

    <div id="weeks"></div>
  </main>

  <footer>Stored only in this browser, on this device.</footer>
</div>

<div class="modal-backdrop hidden" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="field">
      <label for="setName">Your name</label>
      <input type="text" id="setName" placeholder="Your name">
    </div>
    <div class="field">
      <label for="setWhatsapp">Boss's WhatsApp number</label>
      <input type="tel" id="setWhatsapp" placeholder="e.g. 447911123456">
      <div class="hint">Include country code, digits only. Only used as a fallback if direct sharing isn't available on this device.</div>
    </div>
    <div class="field">
      <label for="setCurrency">Currency symbol</label>
      <input type="text" id="setCurrency" maxlength="3" placeholder="£">
    </div>
    <button class="btn-primary" id="closeSettings">Done</button>
  </div>
</div>

<div id="exportRoot" style="position:fixed; left:-9999px; top:0; width:600px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  const STORAGE_KEY = 'expenseDocket.entries.v2';
  const SETTINGS_KEY = 'expenseDocket.settings.v1';
  const DB_NAME = 'expenseDocketPhotos';
  const DB_VERSION = 1;
  const STORE = 'photos';

  let entries = loadEntries();
  let settings = loadSettings();
  let pendingPhoto = null; // { thumb: dataURL, file: original File }

  // ---------- local storage (metadata only) ----------
  function loadEntries(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveEntries(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); }
    catch(e){ alert('Storage is full. Try removing an old entry.'); }
  }
  function loadSettings(){
    try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
    catch(e){ return {}; }
  }
  function saveSettings(){
    try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    catch(e){ /* ignore */ }
  }

  // ---------- IndexedDB (full-resolution photos) ----------
  let dbPromise = null;
  function openDB(){
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function putPhoto(id, blob){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(blob, id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function getPhoto(id){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function deletePhoto(id){
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // ---------- dates (all local, no UTC drift) ----------
  function todayStr(){ return toDateStr(new Date()); }
  function parseLocalDate(str){
    const parts = str.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }
  function toDateStr(d){
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function weekEndingSunday(dateStr){
    const d = parseLocalDate(dateStr);
    d.setDate(d.getDate() + ((7 - d.getDay()) % 7));
    return toDateStr(d);
  }
  function formatDateLong(dateStr){
    return parseLocalDate(dateStr).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
  }
  function formatDateShort(dateStr){
    return parseLocalDate(dateStr).toLocaleDateString('en-GB', {day:'2-digit', month:'short'});
  }

  // ---------- money ----------
  function symbol(){ return settings.currency || '£'; }
  function fmt(n){ return symbol() + n.toFixed(2); }
  function uid(){ return Date.now() + '-' + Math.random().toString(36).slice(2,7); }

  // ---------- element refs ----------
  const expDate = document.getElementById('expDate');
  const expAmount = document.getElementById('expAmount');
  const expNote = document.getElementById('expNote');
  const addBtn = document.getElementById('addBtn');
  const photoBtn = document.getElementById('photoBtn');
  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  const clearPhotoBtn = document.getElementById('clearPhoto');
  const currencySymbolEl = document.getElementById('currencySymbol');
  const weeksEl = document.getElementById('weeks');

  expDate.value = todayStr();
  currencySymbolEl.textContent = symbol();

  function validateForm(){
    const amt = parseFloat(expAmount.value);
    addBtn.disabled = !(expDate.value && amt > 0);
  }
  expAmount.addEventListener('input', validateForm);
  expDate.addEventListener('input', validateForm);

  photoBtn.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const originalLabel = photoBtn.textContent;
    photoBtn.textContent = 'Processing…';
    try{
      const thumb = await compressImage(file, 240, 0.6);
      pendingPhoto = { thumb, file };
      photoPreview.src = thumb;
      photoPreview.style.display = 'inline-block';
      clearPhotoBtn.style.display = 'inline-block';
      photoBtn.textContent = '📷 Retake / choose again';
    }catch(err){
      alert('Could not read that photo — try another.');
      photoBtn.textContent = originalLabel;
    }
    photoInput.value = '';
  });
  clearPhotoBtn.addEventListener('click', () => {
    pendingPhoto = null;
    photoPreview.style.display = 'none';
    clearPhotoBtn.style.display = 'none';
    photoBtn.textContent = '📷 Add photo evidence';
  });

  // Produces a small preview-quality thumbnail only. The original file is
  // kept untouched and stored separately at full resolution.
  async function compressImage(file, maxDim, quality){
    let bitmap;
    try{
      bitmap = await createImageBitmap(file, {imageOrientation:'from-image'});
    }catch(e){
      bitmap = await createImageBitmap(file);
    }
    let width = bitmap.width, height = bitmap.height;
    if (width > maxDim || height > maxDim){
      if (width > height){ height = Math.round(height*maxDim/width); width = maxDim; }
      else { width = Math.round(width*maxDim/height); height = maxDim; }
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
    return canvas.toDataURL('image/jpeg', quality);
  }

  addBtn.addEventListener('click', async () => {
    const amt = parseFloat(expAmount.value);
    if (!(expDate.value && amt > 0)) return;
    addBtn.disabled = true;
    const id = uid();
    let hasPhoto = false;
    if (pendingPhoto){
      try{
        await putPhoto(id, pendingPhoto.file);
        hasPhoto = true;
      }catch(err){
        alert('Could not save the photo (storage may be full). Adding the expense without it.');
      }
    }
    entries.push({
      id,
      date: expDate.value,
      amount: Math.round(amt * 100) / 100,
      note: expNote.value.trim(),
      thumb: pendingPhoto ? pendingPhoto.thumb : null,
      hasPhoto
    });
    saveEntries();
    expAmount.value = '';
    expNote.value = '';
    clearPhotoBtn.click();
    expDate.value = todayStr();
    validateForm();
    render();
  });

  // ---------- settings ----------
  const settingsModal = document.getElementById('settingsModal');
  const setName = document.getElementById('setName');
  const setWhatsapp = document.getElementById('setWhatsapp');
  const setCurrency = document.getElementById('setCurrency');
  document.getElementById('settingsBtn').addEventListener('click', () => {
    setName.value = settings.name || '';
    setWhatsapp.value = settings.bossWhatsapp || '';
    setCurrency.value = settings.currency || '£';
    settingsModal.classList.remove('hidden');
  });
  document.getElementById('closeSettings').addEventListener('click', () => {
    settings.name = setName.value.trim();
    settings.bossWhatsapp = setWhatsapp.value.replace(/[^\d]/g, '');
    settings.currency = setCurrency.value.trim() || '£';
    saveSettings();
    currencySymbolEl.textContent = symbol();
    settingsModal.classList.add('hidden');
    render();
  });
  settingsModal.addEventListener('click', (e) => {
    if (e.target === settingsModal) settingsModal.classList.add('hidden');
  });

  // ---------- render ----------
  function render(){
    if (entries.length === 0){
      weeksEl.innerHTML = '<div class="empty"><p>No expenses logged yet.</p><p>Add your first one above — it will be filed under the matching week.</p></div>';
      return;
    }
    const groups = {};
    entries.forEach(en => {
      const wk = weekEndingSunday(en.date);
      (groups[wk] = groups[wk] || []).push(en);
    });
    const weekKeys = Object.keys(groups).sort().reverse();
    weeksEl.innerHTML = '';
    weekKeys.forEach(wk => {
      const list = groups[wk].slice().sort((a,b) => a.date.localeCompare(b.date));
      const total = list.reduce((s,e) => s + e.amount, 0);
      const card = document.createElement('div');
      card.className = 'week';
      card.innerHTML = `
        <div class="perf"></div>
        <div class="week-head">
          <div>
            <h3>Week ending ${formatDateLong(wk)}</h3>
            <div class="week-count">${list.length} item${list.length===1?'':'s'}</div>
          </div>
          <div class="tag">${fmt(total)}</div>
        </div>
        <div class="entries">
          ${list.map(en => `
            <div class="entry">
              ${en.thumb ? `<img src="${en.thumb}" alt="">` : `<div class="noimg"></div>`}
              <div class="meta">
                <div class="date">${formatDateShort(en.date)}</div>
                <div class="note">${escapeHtml(en.note) || '—'}</div>
              </div>
              <div class="amt">${fmt(en.amount)}</div>
              <button class="del" data-id="${en.id}" aria-label="Delete expense">×</button>
            </div>
          `).join('')}
        </div>
        <div class="week-actions">
          <button class="btn-secondary save" data-week="${wk}">Save to Photos</button>
          <button class="btn-secondary send" data-week="${wk}">Send via WhatsApp</button>
        </div>
      `;
      weeksEl.appendChild(card);
    });

    weeksEl.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this expense?')) return;
        const id = btn.dataset.id;
        entries = entries.filter(e => e.id !== id);
        saveEntries();
        render();
        try{ await deletePhoto(id); }catch(e){ /* ignore */ }
      });
    });
    weeksEl.querySelectorAll('.save').forEach(btn => {
      btn.addEventListener('click', () => saveWeekCopy(btn.dataset.week, btn));
    });
    weeksEl.querySelectorAll('.send').forEach(btn => {
      btn.addEventListener('click', () => sendWeekToBoss(btn.dataset.week, btn));
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function weekList(wk){
    return entries.filter(e => weekEndingSunday(e.date) === wk).sort((a,b) => a.date.localeCompare(b.date));
  }

  function waitForImages(container){
    const imgs = Array.from(container.querySelectorAll('img'));
    return Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(res => { img.onload = res; img.onerror = res; })));
  }

  // Small at-a-glance summary card — always built from lightweight thumbnails,
  // so it stays fast and safe to render regardless of how many receipts there are.
  function buildExportHtml(wk, list, total){
    return `
      <div style="font-family:'IBM Plex Sans',sans-serif; background:#EFE6CE; padding:28px; color:#22271F;">
        <div style="border-bottom:3px solid #F0B429; padding-bottom:14px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:flex-end;">
          <div>
            <div style="font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; text-transform:uppercase; letter-spacing:0.03em;">Week ending ${formatDateLong(wk)}</div>
            ${settings.name ? `<div style="font-size:13px; color:#565C4B; margin-top:4px;">${escapeHtml(settings.name)}</div>` : ''}
          </div>
          <div style="font-family:'Oswald',sans-serif; font-weight:600; font-size:22px; background:#F0B429; padding:6px 14px; border-radius:4px;">${fmt(total)}</div>
        </div>
        ${list.map(en => `
          <div style="display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid #C9BC94;">
            ${en.thumb ? `<img src="${en.thumb}" style="width:56px;height:56px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid #C9BC94;">` : `<div style="width:56px;height:56px;border-radius:4px;border:1px dashed #C9BC94;"></div>`}
            <div style="flex:1;">
              <div style="font-size:12px; color:#565C4B;">${formatDateShort(en.date)}</div>
              <div style="font-size:15px;">${escapeHtml(en.note) || '—'}</div>
            </div>
            <div style="font-weight:600; font-size:15px;">${fmt(en.amount)}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function buildSummaryText(wk, list, total){
    const lines = [`Expenses — week ending ${formatDateLong(wk)}`];
    if (settings.name) lines.push(settings.name);
    lines.push('');
    list.forEach(en => lines.push(`${formatDateShort(en.date)} — ${en.note || 'Expense'} — ${fmt(en.amount)}`));
    lines.push('');
    lines.push(`Total: ${fmt(total)}`);
    return lines.join('\n');
  }

  async function renderOverviewFile(wk, list, total){
    const root = document.getElementById('exportRoot');
    root.innerHTML = buildExportHtml(wk, list, total);
    await waitForImages(root);
    let file = null;
    try{
      const canvas = await html2canvas(root, {backgroundColor:'#EFE6CE', scale:2});
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      if (blob) file = new File([blob], `expenses-week-ending-${wk}.png`, {type:'image/png'});
    }catch(err){ /* caller decides how to handle a missing overview */ }
    root.innerHTML = '';
    return file;
  }

  // ---------- Save to Photos: a tidy weekly summary, saved via the share sheet
  // so it lands in the camera roll rather than the Files app ----------
  async function saveWeekCopy(wk, triggerBtn){
    const list = weekList(wk);
    const total = list.reduce((s,e) => s + e.amount, 0);
    const originalLabel = triggerBtn.textContent;
    triggerBtn.disabled = true;
    triggerBtn.textContent = 'Working…';

    const file = await renderOverviewFile(wk, list, total);
    triggerBtn.disabled = false;
    triggerBtn.textContent = originalLabel;

    if (!file){
      alert('Could not generate the image. Check your connection and try again.');
      return;
    }

    if (navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Expense summary'});
        return;
      }catch(err){
        if (err.name === 'AbortError') return;
      }
    }
    // No share support here (e.g. testing over a non-HTTPS connection) — open the
    // image directly so it can be long-pressed and saved to Photos manually.
    const url = URL.createObjectURL(file);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  // ---------- Send via WhatsApp: the summary image plus every receipt at its
  // original full resolution, handed to the native share sheet ----------
  async function sendWeekToBoss(wk, triggerBtn){
    const list = weekList(wk);
    const total = list.reduce((s,e) => s + e.amount, 0);
    const originalLabel = triggerBtn.textContent;
    triggerBtn.disabled = true;
    triggerBtn.textContent = 'Preparing…';

    const overviewFile = await renderOverviewFile(wk, list, total);

    const photoFiles = [];
    for (const en of list){
      if (en.hasPhoto){
        try{
          const blob = await getPhoto(en.id);
          if (blob) photoFiles.push(new File([blob], `receipt-${en.date}-${en.id.slice(-5)}.jpg`, {type: blob.type || 'image/jpeg'}));
        }catch(e){ /* skip a photo that failed to load */ }
      }
    }

    const text = buildSummaryText(wk, list, total);
    const allFiles = overviewFile ? [overviewFile, ...photoFiles] : photoFiles;

    triggerBtn.disabled = false;
    triggerBtn.textContent = originalLabel;

    if (allFiles.length && navigator.canShare && navigator.canShare({files: allFiles})){
      try{
        await navigator.share({files: allFiles, title:'Weekly expenses', text});
        return;
      }catch(err){
        if (err.name === 'AbortError') return;
      }
    }

    // No file-sharing support here (e.g. testing over a non-HTTPS connection) —
    // save everything locally and open WhatsApp with the summary ready to send.
    allFiles.forEach(f => downloadBlob(f, f.name));
    const waNum = settings.bossWhatsapp || '';
    const note = allFiles.length ? '\n\n(Photos saved to your downloads — attach them here.)' : '';
    window.open(`https://wa.me/${waNum}?text=${encodeURIComponent(text + note)}`, '_blank');
  }

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  render();
})();
</script>
