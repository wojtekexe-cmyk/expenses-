<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E2420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Expense Docket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E2420;--paper:#EFE6CE;--paper-dark:#E2D6B4;--paper-light:#FFF9EA;--line:#C9BC94;--amber:#F0B429;--steel:#2C4451;--rust:#A33B2C;--text:#22271F;--text-soft:#565C4B;--radius-sm:4px;--radius-md:8px}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--steel);outline-offset:2px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column}header.bar{background:var(--ink);color:var(--paper);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--amber)}header.bar h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;letter-spacing:.04em;margin:0;color:var(--amber)}header.bar .sub{font-size:11px;color:var(--paper);opacity:.65;margin-top:3px;letter-spacing:.02em}.header-name{display:block;width:100%;max-width:250px;margin-top:8px;padding:7px 9px;border:1px solid #6b7167;border-radius:4px;background:#2b302c;color:var(--paper);font-size:14px}.header-name::placeholder{color:#b6b9ae}main{padding:16px;flex:1}
.add-card{background:var(--paper-light);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;margin-bottom:22px}.add-card h2,.modal h2{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-soft);margin:0 0 12px}.row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:10px;margin-bottom:12px;align-items:end}.row>.field{width:100%;min-width:0;max-width:100%;overflow:hidden}.row>.field:first-child input[type=date]{inline-size:100%;min-inline-size:0;max-inline-size:100%;}.row input[type=date]{display:block;width:100%;min-width:0;max-width:100%;padding:0 2px;font-size:11px;letter-spacing:-.03em;appearance:none;-webkit-appearance:none;overflow:hidden}.row .amount-wrap{width:100%;min-width:0}.row .amount-wrap span{flex-basis:24px;width:24px;min-width:24px}.field{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}.field label{font-size:11px;color:var(--text-soft);line-height:1.25;min-height:14px}input[type=date],input[type=text],input[type=tel]{display:block;box-sizing:border-box;height:44px;border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);padding:0 10px;font-size:15px;line-height:normal;color:var(--text);width:100%;min-width:0;max-width:100%}.amount-wrap{display:flex;align-items:stretch;min-width:0;width:100%;height:44px;overflow:hidden;border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);box-sizing:border-box}.amount-wrap span{display:flex;align-items:center;justify-content:center;flex:0 0 28px;width:28px;min-width:28px;text-align:center;padding:0;color:var(--text-soft);font-size:15px;white-space:nowrap}.amount-wrap input,.amount-wrap input[type=text]{display:block;box-sizing:border-box;flex:1 1 0%;width:0;min-width:0;max-width:100%;height:100%;border:0!important;border-radius:0!important;background:transparent;padding:0 5px;font-size:15px;line-height:normal;outline-offset:-2px;appearance:none;-webkit-appearance:none}.details-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end;margin-bottom:12px}.details-row .field{min-width:0}.photo-row{display:flex;align-items:stretch;gap:5px;min-width:0;width:100%;margin:0}.photo-btn{display:block;box-sizing:border-box;width:100%;min-width:0;height:44px;overflow:hidden;border:1px dashed var(--steel);background:none;color:var(--steel);padding:0 6px;border-radius:var(--radius-sm);font-size:11px;line-height:1.2;cursor:pointer;white-space:normal;overflow-wrap:anywhere}.thumb{width:32px;height:32px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--line)}.clear-photo{background:none;border:0;color:var(--rust);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}.btn-primary{width:100%;background:var(--amber);border:0;color:var(--ink);font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;font-size:15px;padding:13px;border-radius:var(--radius-sm);cursor:pointer}.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.week{margin-bottom:24px}.perf{border-top:2px dashed var(--line);margin-bottom:12px}.week-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}.week-head h3{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.02em;text-transform:uppercase;margin:0;color:var(--text)}.week-count{font-size:12px;color:var(--text-soft);margin-top:2px}.tag{background:var(--amber);color:var(--ink);font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;padding:6px 10px;border-radius:var(--radius-sm);white-space:nowrap;flex-shrink:0}.entries{border-top:1px solid var(--line)}.entry{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.entry img,.entry .noimg{width:40px;height:40px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--line);flex-shrink:0}.entry .noimg{border-style:dashed}.entry .meta{flex:1;min-width:0}.entry .date{font-size:11px;color:var(--text-soft)}.entry .note{font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.entry .amt{font-weight:600;font-size:14px;flex-shrink:0}.entry .del{background:none;border:0;color:var(--rust);font-size:18px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0}.week-actions{display:flex;gap:10px;margin-top:12px}.btn-secondary{flex:1;background:none;border:1px solid var(--steel);color:var(--steel);font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.02em;padding:10px 6px;border-radius:var(--radius-sm);cursor:pointer}.btn-secondary.send{border-color:var(--ink);color:var(--ink);background:var(--paper-dark)}.btn-secondary:disabled{opacity:.5;cursor:wait}.empty{text-align:center;padding:40px 20px;color:var(--text-soft)}.empty p{margin:6px 0}.danger-zone{border-top:1px solid var(--line);padding-top:18px;margin-top:8px}.btn-danger{width:100%;background:#A32323;border:1px solid #7F1717;color:#fff;font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.03em;font-size:15px;padding:13px;border-radius:var(--radius-sm);cursor:pointer}.btn-danger:active{background:#7F1717}.danger-hint{text-align:center;color:var(--text-soft);font-size:11px;margin:8px 0 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}.modal-backdrop.hidden{display:none}.modal{background:var(--paper);width:100%;max-width:480px;border-radius:12px 12px 0 0;padding:20px;max-height:90vh;overflow:auto}.modal h2{font-size:16px;color:var(--text);margin-bottom:14px}.modal .field{margin-bottom:12px}.modal .hint{font-size:11px;color:var(--text-soft);margin-top:3px}footer{text-align:center;font-size:11px;color:var(--text-soft);opacity:.7;padding:16px}
</style>
</head>
<body>
<div class="app">
  <header class="bar"><div><h1>Expenses</h1><input class="header-name" type="text" id="headerName" placeholder="Name" aria-label="Your name" maxlength="100"><div class="sub">Weekly claims — week ending Sunday</div></div></header>
  <main>
    <section class="add-card">
      <h2>Add expense</h2>
      <div class="row"><div class="field"><label for="expDate">Date</label><input type="date" id="expDate" required></div><div class="field"><label for="expAmount">Amount</label><div class="amount-wrap"><span id="currencySymbol">£</span><input type="text" inputmode="decimal" id="expAmount" placeholder="0.00" autocomplete="off" aria-label="Expense amount"></div></div></div>
      <div class="details-row"><div class="photo-row"><button type="button" class="photo-btn" id="photoBtn">📷 Add photo evidence</button><img id="photoPreview" class="thumb" style="display:none" alt="Selected receipt preview"><button type="button" class="clear-photo" id="clearPhoto" style="display:none">Remove</button></div><div class="field"><label for="expNote">What for (optional)</label><input type="text" id="expNote" placeholder="e.g. Fuel, parking, materials" maxlength="200"></div></div>
      <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
      <button class="btn-primary" id="addBtn" disabled>Add expense</button>
    </section>
    <div id="weeks" aria-live="polite"></div>
    <section class="danger-zone"><button type="button" class="btn-danger" id="clearAllBtn">Clear all expenses</button><p class="danger-hint">Permanently deletes every expense and its saved receipt photos from this browser.</p></section>
  </main>
  <footer>Stored only in this browser, on this device.</footer>
</div>
<div id="exportRoot" style="position:fixed;left:-99999px;top:0;width:600px;pointer-events:none" aria-hidden="true"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script>
(() => {
  'use strict';
  const STORAGE_KEY='expenseDocket.entries.v2', SETTINGS_KEY='expenseDocket.settings.v1', DB_NAME='expenseDocketPhotos', DB_VERSION=1, STORE='photos';
  let entries=loadEntries(), settings=loadSettings(), pendingPhoto=null, dbPromise=null;
  const $=id=>document.getElementById(id);
  const expDate=$('expDate'), expAmount=$('expAmount'), expNote=$('expNote'), addBtn=$('addBtn'), photoBtn=$('photoBtn'), photoInput=$('photoInput'), photoPreview=$('photoPreview'), clearPhotoBtn=$('clearPhoto'), currencySymbolEl=$('currencySymbol'), weeksEl=$('weeks');
  function loadEntries(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));return Array.isArray(v)?v.filter(e=>e&&typeof e.id==='string'&&typeof e.date==='string'&&Number.isFinite(Number(e.amount))):[]}catch{return []}}
  function saveEntries(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(entries));return true}catch{alert('Browser storage is full. Remove an old entry or export your data before continuing.');return false}}
  function loadSettings(){try{const v=JSON.parse(localStorage.getItem(SETTINGS_KEY));return v&&typeof v==='object'?v:{}}catch{return {}}}
  function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch{alert('Could not save settings. Browser storage may be full.')}}
  function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('IndexedDB unavailable'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(new Error('Database is blocked'))});dbPromise.catch(()=>{dbPromise=null});return dbPromise}
  async function photoRequest(mode,action,id,blob){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),store=tx.objectStore(STORE);let req;if(action==='put')req=store.put(blob,id);else if(action==='get')req=store.get(id);else if(action==='delete')req=store.delete(id);else req=store.clear();let result=null;if(req)req.onsuccess=()=>{result=req.result??null};req.onerror=()=>reject(req.error);tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Database operation aborted'))})}
  const putPhoto=(id,blob)=>photoRequest('readwrite','put',id,blob),getPhoto=id=>photoRequest('readonly','get',id),deletePhoto=id=>photoRequest('readwrite','delete',id),clearPhotos=()=>photoRequest('readwrite','clear');
  function todayStr(){return toDateStr(new Date())}function parseLocalDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function toDateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function weekEndingSunday(s){const d=parseLocalDate(s);d.setDate(d.getDate()+((7-d.getDay())%7));return toDateStr(d)}function formatDateLong(s){return parseLocalDate(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}function formatDateShort(s){return parseLocalDate(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}
  function symbol(){return '£'}function fmt(n){return symbol()+Number(n).toFixed(2)}function uid(){return `${Date.now()}-${Math.random().toString(36).slice(2,9)}`}
  function validateForm(){const raw=expAmount.value.trim().replace(/,/g,'.'),amt=Number(raw);addBtn.disabled=!(expDate.value&&/^\d+(\.\d{1,2})?$/.test(raw)&&Number.isFinite(amt)&&amt>0)}
  expDate.value=todayStr();currencySymbolEl.textContent='£';expAmount.addEventListener('input',validateForm);expDate.addEventListener('input',validateForm);
  photoBtn.addEventListener('click',()=>photoInput.click());
  photoInput.addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const old=photoBtn.textContent;photoBtn.disabled=true;photoBtn.textContent='Processing…';try{if(!file.type.startsWith('image/'))throw new Error('Not an image');const thumb=await compressImage(file,240,.6);pendingPhoto={thumb,file};photoPreview.src=thumb;photoPreview.style.display='inline-block';clearPhotoBtn.style.display='inline-block';photoBtn.textContent='📷 Retake / choose again'}catch(err){alert('Could not read that photo. Try another image.');photoBtn.textContent=old}finally{photoBtn.disabled=false;photoInput.value=''}});
  clearPhotoBtn.addEventListener('click',()=>{pendingPhoto=null;photoPreview.removeAttribute('src');photoPreview.style.display='none';clearPhotoBtn.style.display='none';photoBtn.textContent='📷 Add photo evidence'});
  async function compressImage(file,maxDim,quality){let bitmap;try{bitmap=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{bitmap=await createImageBitmap(file)}try{let w=bitmap.width,h=bitmap.height;if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas unavailable');ctx.drawImage(bitmap,0,0,w,h);return canvas.toDataURL('image/jpeg',quality)}finally{bitmap.close?.()}}
  addBtn.addEventListener('click',async()=>{const raw=expAmount.value.trim().replace(/,/g,'.'),amt=Number(raw);if(!(expDate.value&&/^\d+(\.\d{1,2})?$/.test(raw)&&Number.isFinite(amt)&&amt>0))return;addBtn.disabled=true;addBtn.textContent='Saving…';const id=uid();let hasPhoto=false;if(pendingPhoto){try{await putPhoto(id,pendingPhoto.file);hasPhoto=true}catch{alert('The receipt photo could not be saved. The expense will be added without the original photo.')}}const entry={id,date:expDate.value,amount:Math.round(amt*100)/100,note:expNote.value.trim(),thumb:pendingPhoto?pendingPhoto.thumb:null,hasPhoto};entries.push(entry);if(!saveEntries()){entries=entries.filter(e=>e.id!==id);if(hasPhoto)try{await deletePhoto(id)}catch{}addBtn.textContent='Add expense';validateForm();return}expAmount.value='';expNote.value='';clearPhotoBtn.click();expDate.value=todayStr();addBtn.textContent='Add expense';validateForm();render()});
  $('headerName').value=settings.name||'';
  $('headerName').addEventListener('input',()=>{settings.name=$('headerName').value.trim();saveSettings()});
  $('clearAllBtn').addEventListener('click',async()=>{if(entries.length===0){alert('There are no expenses to clear.');return}if(!confirm(`Delete ALL ${entries.length} expense${entries.length===1?'':'s'} and their saved receipt photos? This cannot be undone.`))return;const oldEntries=entries;entries=[];if(!saveEntries()){entries=oldEntries;render();return}try{await clearPhotos()}catch(err){alert('Expenses were cleared, but the browser could not clear the photo database. Any leftover photos are no longer linked to expenses.')}pendingPhoto=null;photoPreview.removeAttribute('src');photoPreview.style.display='none';clearPhotoBtn.style.display='none';photoBtn.textContent='📷 Add photo evidence';render()});
  function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function render(){if(entries.length===0){weeksEl.innerHTML='<div class="empty"><p>No expenses logged yet.</p><p>Add your first one above — it will be filed under the matching week.</p></div>';return}const groups={};entries.forEach(en=>{const wk=weekEndingSunday(en.date);(groups[wk]||(groups[wk]=[])).push(en)});weeksEl.replaceChildren();Object.keys(groups).sort().reverse().forEach(wk=>{const list=groups[wk].slice().sort((a,b)=>a.date.localeCompare(b.date)),total=list.reduce((s,e)=>s+Number(e.amount),0),card=document.createElement('section');card.className='week';card.innerHTML=`<div class="perf"></div><div class="week-head"><div><h3>Week ending ${formatDateLong(wk)}</h3><div class="week-count">${list.length} item${list.length===1?'':'s'}</div></div><div class="tag">${fmt(total)}</div></div><div class="entries">${list.map(en=>`<div class="entry">${en.thumb?`<img src="${en.thumb}" alt="Receipt thumbnail">`:'<div class="noimg" aria-hidden="true"></div>'}<div class="meta"><div class="date">${formatDateShort(en.date)}</div><div class="note">${escapeHtml(en.note)||'—'}</div></div><div class="amt">${fmt(en.amount)}</div><button class="del" data-id="${escapeHtml(en.id)}" aria-label="Delete expense">×</button></div>`).join('')}</div><div class="week-actions"><button class="btn-secondary save" data-week="${wk}">Save to Photos</button><button class="btn-secondary send" data-week="${wk}">Send via WhatsApp</button></div>`;weeksEl.appendChild(card)});
    weeksEl.querySelectorAll('.del').forEach(btn=>btn.addEventListener('click',async()=>{if(!confirm('Delete this expense?'))return;const id=btn.dataset.id,old=entries;entries=entries.filter(e=>e.id!==id);if(!saveEntries()){entries=old;return}render();try{await deletePhoto(id)}catch{}}));weeksEl.querySelectorAll('.save').forEach(btn=>btn.addEventListener('click',()=>saveWeekCopy(btn.dataset.week,btn)));weeksEl.querySelectorAll('.send').forEach(btn=>btn.addEventListener('click',()=>sendWeekToBoss(btn.dataset.week,btn)))}
  function weekList(wk){return entries.filter(e=>weekEndingSunday(e.date)===wk).sort((a,b)=>a.date.localeCompare(b.date))}function waitForImages(root){return Promise.all(Array.from(root.querySelectorAll('img')).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve}))) }
  function buildExportHtml(wk,list,total){return `<div style="font-family:'IBM Plex Sans',sans-serif;background:#EFE6CE;padding:28px;color:#22271F"><div style="border-bottom:3px solid #F0B429;padding-bottom:14px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end"><div><div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.03em">Week ending ${formatDateLong(wk)}</div>${settings.name?`<div style="font-size:13px;color:#565C4B;margin-top:4px">${escapeHtml(settings.name)}</div>`:''}</div><div style="font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;background:#F0B429;padding:6px 14px;border-radius:4px">${fmt(total)}</div></div>${list.map(en=>`<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #C9BC94">${en.thumb?`<img src="${en.thumb}" style="width:56px;height:56px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid #C9BC94">`:'<div style="width:56px;height:56px;border-radius:4px;border:1px dashed #C9BC94"></div>'}<div style="flex:1"><div style="font-size:12px;color:#565C4B">${formatDateShort(en.date)}</div><div style="font-size:15px;overflow-wrap:anywhere">${escapeHtml(en.note)||'—'}</div></div><div style="font-weight:600;font-size:15px">${fmt(en.amount)}</div></div>`).join('')}</div>`}
  function buildSummaryText(wk,list,total){const lines=[`Expenses — week ending ${formatDateLong(wk)}`];if(settings.name)lines.push(settings.name);lines.push('');list.forEach(en=>lines.push(`${formatDateShort(en.date)} — ${en.note||'Expense'} — ${fmt(en.amount)}`));lines.push('',`Total: ${fmt(total)}`);return lines.join('\n')}
  async function renderOverviewFile(wk,list,total){if(typeof window.html2canvas!=='function')return null;const root=$('exportRoot');root.innerHTML=buildExportHtml(wk,list,total);try{await waitForImages(root);const canvas=await window.html2canvas(root,{backgroundColor:'#EFE6CE',scale:2});const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));return blob?new File([blob],`expenses-week-ending-${wk}.png`,{type:'image/png'}):null}catch{return null}finally{root.innerHTML=''}}
  async function saveWeekCopy(wk,btn){const list=weekList(wk);if(!list.length)return;const total=list.reduce((s,e)=>s+Number(e.amount),0),old=btn.textContent;btn.disabled=true;btn.textContent='Working…';try{const file=await renderOverviewFile(wk,list,total);if(!file){alert('Could not generate the summary image. Check your connection and ensure the image-generation library has loaded.');return}if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Expense summary'});return}catch(err){if(err.name==='AbortError')return}}const url=URL.createObjectURL(file);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}finally{btn.disabled=false;btn.textContent=old}}
  async function sendWeekToBoss(wk,btn){const list=weekList(wk);if(!list.length)return;const total=list.reduce((s,e)=>s+Number(e.amount),0),old=btn.textContent;btn.disabled=true;btn.textContent='Preparing…';try{const overview=await renderOverviewFile(wk,list,total),photoFiles=[];for(const en of list){if(en.hasPhoto){try{const blob=await getPhoto(en.id);if(blob)photoFiles.push(new File([blob],`receipt-${en.date}-${en.id.slice(-5)}.${(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg')}`,{type:blob.type||'image/jpeg'}))}catch{}}}const text=buildSummaryText(wk,list,total),allFiles=overview?[overview,...photoFiles]:photoFiles;if(allFiles.length&&navigator.canShare&&navigator.canShare({files:allFiles})){try{await navigator.share({files:allFiles,title:'Weekly expenses',text});return}catch(err){if(err.name==='AbortError')return}}allFiles.forEach(f=>downloadBlob(f,f.name));const num=settings.bossWhatsapp||'',note=allFiles.length?'\n\n(Expense images were downloaded. Attach them to this message.)':'';window.open(`https://wa.me/${num}?text=${encodeURIComponent(text+note)}`,'_blank','noopener')}finally{btn.disabled=false;btn.textContent=old}}
  function downloadBlob(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
  render();validateForm();
})();
</script>
</body>
</html>
