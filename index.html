<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#21242C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Adex Expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#21242C; --slate:#3B414C; --slate-2:#3F4551; --page:#EEEDE8; --card:#F6F5F0;
  --line:#CFCBBE; --amber:#EDB83A; --text:#21242C; --soft:#6B6F76; --rust:#A33B2C;
  --mono:'IBM Plex Mono',monospace; --head:'Oswald',sans-serif; --sans:'IBM Plex Sans',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--night)}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:14px}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--page)}

/* Header */
.top{background:var(--night);padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 0;color:#F4F3EC}
.top h1{font-family:var(--head);font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 12px;line-height:1.1}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.top .lbl{color:#9A9DA3;display:block;margin-bottom:8px}
.name{width:100%;height:30px;background:var(--slate-2);border:1px solid #555B67;border-radius:4px;color:#F4F3EC;font-family:var(--mono);font-size:12px;padding:0 9px;-webkit-appearance:none;appearance:none}
.hazard{height:5px;margin:18px -18px 0;background:repeating-linear-gradient(115deg,var(--amber) 0 14px,transparent 14px 25px)}
.weekbox{text-align:center;padding:20px 0 20px}
.weekbox .lbl{color:#9A9DA3}
.weeknav{display:flex;align-items:center;justify-content:space-between;width:317px;max-width:100%;margin:8px auto 4px}
.nav{width:36px;height:36px;border-radius:4px;border:1px solid #555B67;background:var(--slate-2);color:#F4F3EC;font-size:18px;line-height:1;flex-shrink:0;padding:0}
.nav:active{background:var(--slate)}
.weekdate{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:.02em;color:var(--amber);white-space:nowrap}
.weekdate i{font-style:normal;color:#F4F3EC;margin:0 .6em;opacity:.9}
.range{font-family:var(--mono);font-size:11px;color:#9A9DA3;margin-bottom:12px}
.total{font-family:var(--mono);font-size:11px;color:#F4F3EC;margin-bottom:14px}
.total b{color:var(--amber);font-size:16px;margin-left:6px}
.jump{background:none;border:none;color:var(--amber);font-family:var(--mono);font-size:11px;text-decoration:underline;padding:6px}

/* Cards */
main{padding:15px 13px calc(env(safe-area-inset-bottom,0px) + 110px)}
.day{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:11px}
.day-side{width:58px;flex-shrink:0;background:var(--slate);color:#F4F3EC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 2px;text-align:center}
.day-side b{font-family:var(--head);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.day-side span{font-family:var(--mono);font-size:10px;color:#C9CBD0}
.day-body{flex:1;min-width:0;padding:12px}
.field{margin-bottom:12px;min-width:0}
.field .lbl{display:block;margin-bottom:6px}
.in{display:flex;align-items:center;height:38px;width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 10px;transition:border-color .15s,box-shadow .15s}
.in:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(237,184,58,.3)}
.in input{flex:1;min-width:0;width:100%;height:100%;border:none;background:none;padding:0;outline:none;color:var(--text);-webkit-appearance:none;appearance:none;text-align:left}
.in input::placeholder{color:#A9A9A9}
.in input[type=date]{display:block}
.in input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.in .cur{font-family:var(--mono);color:var(--soft);margin-right:7px;font-size:14px}
.photo-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ghost{flex:1;height:38px;padding:0 12px;border:1px dashed var(--slate);border-radius:4px;background:none;color:var(--slate);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.thumb{display:none;width:38px;height:38px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.clear-photo{display:none;background:none;border:none;color:var(--rust);font-family:var(--mono);font-size:11px;text-decoration:underline;padding:6px}
.btn-amber{width:100%;height:42px;border:none;border-radius:5px;background:var(--amber);color:var(--text);font-family:var(--sans);font-weight:600;font-size:15px}
.btn-amber:active:not(:disabled){filter:brightness(.93)}
.btn-amber:disabled{opacity:.4;cursor:not-allowed}

/* Entries */
.entry .day-body{display:flex;align-items:center;gap:10px;padding:10px 12px}
.entry img,.entry .noimg{width:40px;height:40px;border-radius:4px;flex-shrink:0;object-fit:cover;border:1px solid var(--line)}
.entry .noimg{border-style:dashed;display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:#B5B2A4}
.meta{flex:1;min-width:0}
.note{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--mono);font-weight:700;font-size:15px;margin-top:2px}
.del{width:34px;height:34px;border:1px solid var(--line);border-radius:4px;background:none;color:var(--rust);font-size:18px;line-height:1;flex-shrink:0;padding:0}
.del:active{background:rgba(163,59,44,.1)}
.empty{text-align:center;padding:24px 18px;border:1px dashed var(--line);border-radius:8px;color:var(--soft);margin-bottom:11px}
.empty b{display:block;font-family:var(--head);font-size:16px;letter-spacing:.05em;text-transform:uppercase;color:var(--text);margin-bottom:6px}
.empty span{font-size:12px}
.erase{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.erase button{width:100%;height:42px;border:none;border-radius:5px;background:var(--rust);color:#fff;font-family:var(--sans);font-weight:600;font-size:15px}
.erase button:active{filter:brightness(.9)}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line)}
.bar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:11px 13px calc(env(safe-area-inset-bottom,0px) + 11px)}
.bar button{height:43px;border-radius:5px;font-family:var(--sans);font-weight:600;font-size:15px}
.b-out{background:var(--card);border:2px solid var(--slate);color:var(--text)}
.b-amber{background:var(--amber);border:2px solid var(--amber);color:var(--text)}
.bar button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Adex Drilling Services</h1>
    <label class="lbl" for="userName">Name</label>
    <input class="name" type="text" id="userName" placeholder="Your name" autocomplete="name">
    <div class="hazard"></div>
    <div class="weekbox">
      <span class="lbl">Expenses week ending</span>
      <div class="weeknav">
        <button class="nav" id="prevWk" aria-label="Previous week">‹</button>
        <div class="weekdate" id="weekDate"></div>
        <button class="nav" id="nextWk" aria-label="Next week">›</button>
      </div>
      <div class="range" id="weekRange"></div>
      <div class="total">Total<b id="weekTotal"></b></div>
      <button class="jump" id="jumpBtn">Jump to this week</button>
    </div>
  </header>

  <main>
    <section class="day">
      <div class="day-side"><b>New</b><span>expense</span></div>
      <div class="day-body">
        <div class="field"><label class="lbl" for="expDate">Date</label><div class="in"><input type="date" id="expDate"></div></div>
        <div class="field"><label class="lbl" for="expAmount">Amount</label><div class="in"><span class="cur" id="currencySymbol">£</span><input type="text" inputmode="decimal" id="expAmount" placeholder="0.00"></div></div>
        <div class="field"><label class="lbl" for="expNote">What for</label><div class="in"><input type="text" id="expNote" placeholder="e.g. Fuel, parking"></div></div>
        <div class="photo-row">
          <button type="button" class="ghost" id="photoBtn">📷 Add photo</button>
          <img id="photoPreview" class="thumb" alt="">
          <button type="button" class="clear-photo" id="clearPhoto">Remove</button>
        </div>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <button class="btn-amber" id="addBtn" disabled>Add expense</button>
      </div>
    </section>

    <div id="list"></div>
    <div class="erase"><button id="eraseAllBtn">Erase all expenses data</button></div>
  </main>
</div>

<div class="bar"><div class="bar-in">
  <button class="b-out" id="saveBtn">Save photo</button>
  <button class="b-amber" id="sendBtn">Share to boss</button>
</div></div>

<div id="exportRoot" style="position:fixed;left:-9999px;top:0;width:600px"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  const STORAGE_KEY='expenseDocket.entries.v2', SETTINGS_KEY='expenseDocket.settings.v1';
  const DB_NAME='expenseDocketPhotos', STORE='photos';
  let entries=load(STORAGE_KEY,[]), settings=load(SETTINGS_KEY,{}), pendingPhoto=null;

  function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
  function saveEntries(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(entries))}catch(e){alert('Storage is full. Try removing an old entry.')}}
  function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch(e){}}

  // IndexedDB (full-resolution photos)
  let dbP=null;
  function openDB(){
    return dbP||(dbP=new Promise((res,rej)=>{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }));
  }
  async function tx(mode,fn){
    const db=await openDB();
    return new Promise((res,rej)=>{
      const t=db.transaction(STORE,mode); const req=fn(t.objectStore(STORE));
      t.oncomplete=()=>res(req?req.result:undefined); t.onerror=()=>rej(t.error);
    });
  }
  const putPhoto=(id,b)=>tx('readwrite',s=>s.put(b,id));
  const getPhoto=id=>tx('readonly',s=>s.get(id));
  const deletePhoto=id=>tx('readwrite',s=>s.delete(id));
  const clearAllPhotos=()=>tx('readwrite',s=>s.clear());

  // dates
  const pad=n=>String(n).padStart(2,'0');
  const toStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const todayStr=()=>toStr(new Date());
  function parse(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
  function weekEnding(s){const d=parse(s);d.setDate(d.getDate()+((7-d.getDay())%7));return toStr(d)}
  function shift(s,days){const d=parse(s);d.setDate(d.getDate()+days);return toStr(d)}
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const fmtLong=s=>{const d=parse(s);return pad(d.getDate())+' '+MON[d.getMonth()]+' '+d.getFullYear()};
  const fmtShort=s=>{const d=parse(s);return d.toLocaleDateString('en-GB',{weekday:'short'})+' '+d.getDate()+' '+MON[d.getMonth()]};
  const dm=s=>{const d=parse(s);return MON[d.getMonth()]+' '+d.getDate()};

  const symbol=()=>settings.currency||'£';
  const fmt=n=>symbol()+n.toFixed(2);
  const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2,7);
  const $=id=>document.getElementById(id);
  const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};

  const expDate=$('expDate'),expAmount=$('expAmount'),expNote=$('expNote'),addBtn=$('addBtn'),
        photoBtn=$('photoBtn'),photoInput=$('photoInput'),photoPreview=$('photoPreview'),
        clearBtn=$('clearPhoto'),listEl=$('list'),nameInput=$('userName');
  let selWeek=weekEnding(todayStr());

  expDate.value=todayStr();
  $('currencySymbol').textContent=symbol();
  nameInput.value=settings.name||'';
  nameInput.addEventListener('input',()=>{settings.name=nameInput.value.trim();saveSettings()});

  $('prevWk').addEventListener('click',()=>{selWeek=shift(selWeek,-7);render()});
  $('nextWk').addEventListener('click',()=>{selWeek=shift(selWeek,7);render()});
  $('jumpBtn').addEventListener('click',()=>{selWeek=weekEnding(todayStr());render()});

  function validate(){addBtn.disabled=!(expDate.value&&parseFloat(expAmount.value)>0)}
  expAmount.addEventListener('input',validate);
  expDate.addEventListener('input',validate);
  photoBtn.addEventListener('click',()=>photoInput.click());

  photoInput.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file) return;
    const label=photoBtn.textContent; photoBtn.textContent='Processing…';
    try{
      const thumb=await compress(file,240,.6);
      pendingPhoto={thumb,file};
      photoPreview.src=thumb; photoPreview.style.display='block'; clearBtn.style.display='block';
      photoBtn.textContent='📷 Change';
    }catch(err){alert('Could not read that photo. Try another.');photoBtn.textContent=label}
    photoInput.value='';
  });
  clearBtn.addEventListener('click',()=>{
    pendingPhoto=null; photoPreview.style.display='none'; clearBtn.style.display='none';
    photoBtn.textContent='📷 Add photo';
  });

  async function compress(file,max,q){
    let bm; try{bm=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bm=await createImageBitmap(file)}
    let w=bm.width,h=bm.height;
    if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(bm,0,0,w,h);
    return c.toDataURL('image/jpeg',q);
  }

  addBtn.addEventListener('click',async()=>{
    const amt=parseFloat(expAmount.value);
    if(!(expDate.value&&amt>0)) return;
    addBtn.disabled=true;
    const id=uid(); let hasPhoto=false;
    if(pendingPhoto){
      try{await putPhoto(id,pendingPhoto.file);hasPhoto=true}
      catch(err){alert('Could not save the photo (storage may be full). Adding the expense without it.')}
    }
    entries.push({id,date:expDate.value,amount:Math.round(amt*100)/100,note:expNote.value.trim(),thumb:pendingPhoto?pendingPhoto.thumb:null,hasPhoto});
    saveEntries();
    selWeek=weekEnding(expDate.value);
    expAmount.value=''; expNote.value=''; clearBtn.click(); expDate.value=todayStr();
    validate(); render();
  });

  $('eraseAllBtn').addEventListener('click',async()=>{
    if(!confirm('Permanently erase ALL stored expenses and receipts?')) return;
    entries=[]; saveEntries();
    try{await clearAllPhotos()}catch(e){}
    render();
  });

  const weekList=wk=>entries.filter(e=>weekEnding(e.date)===wk).sort((a,b)=>a.date.localeCompare(b.date));

  function render(){
    const list=weekList(selWeek), total=list.reduce((s,e)=>s+e.amount,0);
    const d=parse(selWeek);
    $('weekDate').innerHTML=pad(d.getDate())+'<i>·</i>'+MON[d.getMonth()].toUpperCase()+'<i>·</i>'+d.getFullYear();
    $('weekRange').textContent=dm(shift(selWeek,-6))+' – '+dm(selWeek);
    $('weekTotal').textContent=fmt(total);
    $('saveBtn').disabled=$('sendBtn').disabled=!list.length;

    if(!list.length){
      listEl.innerHTML='<div class="empty"><b>No expenses this week</b><span>Add one above, or use the arrows to browse other weeks.</span></div>';
      return;
    }
    listEl.innerHTML=list.map(en=>{
      const dt=parse(en.date);
      return `<div class="day entry">
        <div class="day-side"><b>${dt.toLocaleDateString('en-GB',{weekday:'short'})}</b><span>${dt.getDate()} ${MON[dt.getMonth()]}</span></div>
        <div class="day-body">
          ${en.thumb?`<img src="${en.thumb}" alt="">`:`<div class="noimg">£</div>`}
          <div class="meta"><div class="note">${esc(en.note)||'Expense'}</div><div class="amt">${fmt(en.amount)}</div></div>
          <button class="del" data-id="${en.id}" aria-label="Delete expense">×</button>
        </div></div>`;
    }).join('');
    listEl.querySelectorAll('.del').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('Delete this expense?')) return;
      const id=b.dataset.id; entries=entries.filter(e=>e.id!==id); saveEntries(); render();
      try{await deletePhoto(id)}catch(e){}
    }));
  }

  const waitImgs=root=>Promise.all([...root.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));

  function exportHtml(wk,list,total){
    return `<div style="font-family:'IBM Plex Sans',sans-serif;background:#EEEDE8;padding:28px;color:#21242C">
      <div style="background:#21242C;color:#F4F3EC;padding:20px;border-radius:8px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:6px solid #EDB83A">
        <div>
          <div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em">Adex Drilling Services</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:#EDB83A;margin-top:6px">Week ending ${fmtLong(wk)}</div>
          ${settings.name?`<div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9A9DA3;margin-top:4px">${esc(settings.name)}</div>`:''}
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:24px;color:#EDB83A">${fmt(total)}</div>
      </div>
      ${list.map(en=>`<div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #CFCBBE">
        ${en.thumb?`<img src="${en.thumb}" style="width:56px;height:56px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid #CFCBBE">`:`<div style="width:56px;height:56px;border-radius:4px;border:1px dashed #CFCBBE"></div>`}
        <div style="flex:1"><div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6B6F76">${fmtShort(en.date)}</div><div style="font-size:15px">${esc(en.note)||'Expense'}</div></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px">${fmt(en.amount)}</div></div>`).join('')}
    </div>`;
  }
  function summaryText(wk,list,total){
    const l=[`Expenses, week ending ${fmtLong(wk)}`]; if(settings.name) l.push(settings.name); l.push('');
    list.forEach(en=>l.push(`${fmtShort(en.date)} - ${en.note||'Expense'} - ${fmt(en.amount)}`));
    l.push('',`Total: ${fmt(total)}`); return l.join('\n');
  }
  async function overviewFile(wk,list,total){
    const root=$('exportRoot'); root.innerHTML=exportHtml(wk,list,total); await waitImgs(root);
    let file=null;
    try{
      const canvas=await html2canvas(root,{backgroundColor:'#EEEDE8',scale:2});
      const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
      if(blob) file=new File([blob],`expenses-week-ending-${wk}.png`,{type:'image/png'});
    }catch(e){}
    root.innerHTML=''; return file;
  }

  $('saveBtn').addEventListener('click',async()=>{
    const btn=$('saveBtn'), list=weekList(selWeek), total=list.reduce((s,e)=>s+e.amount,0), label=btn.textContent;
    btn.disabled=true; btn.textContent='Working…';
    const file=await overviewFile(selWeek,list,total);
    btn.textContent=label; btn.disabled=false;
    if(!file){alert('Could not generate the image. Check your connection and try again.');return}
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Expense summary'});return}
      catch(err){if(err.name==='AbortError') return}
    }
    const url=URL.createObjectURL(file); window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),60000);
  });

  $('sendBtn').addEventListener('click',async()=>{
    const btn=$('sendBtn'), wk=selWeek, list=weekList(wk), total=list.reduce((s,e)=>s+e.amount,0), label=btn.textContent;
    btn.disabled=true; btn.textContent='Preparing…';
    const overview=await overviewFile(wk,list,total), photos=[];
    for(const en of list){
      if(en.hasPhoto){
        try{const b=await getPhoto(en.id); if(b) photos.push(new File([b],`receipt-${en.date}-${en.id.slice(-5)}.jpg`,{type:b.type||'image/jpeg'}))}catch(e){}
      }
    }
    const text=summaryText(wk,list,total), files=overview?[overview,...photos]:photos;
    btn.textContent=label; btn.disabled=false;
    if(files.length&&navigator.canShare&&navigator.canShare({files})){
      try{await navigator.share({files,title:'Weekly expenses',text});return}
      catch(err){if(err.name==='AbortError') return}
    }
    files.forEach(f=>{const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)});
    window.open(`https://wa.me/?text=${encodeURIComponent(text+(files.length?'\n\n(Photos saved to your downloads. Attach them here.)':''))}`,'_blank');
  });

  render();
})();
</script>
</body>
</html>
